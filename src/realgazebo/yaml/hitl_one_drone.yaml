# hitl_one_drone.yaml
#
# One real flight controller (HITL) driving a vehicle in the shared gz world,
# via gz-hitl-bridge. A HITL vehicle differs from a SITL vehicle only by:
#   - mode: hitl            -> routes to the bridge backend (no PX4 SITL process)
#   - fc: {device,baud}     -> the real FC's serial link (or udp+local_port)
#   - build_target omitted  -> the bridge binary comes from default_px4_path
# Everything else (type, spawnpoint, the numeric id key) behaves exactly like
# a SITL vehicle, so gz name (lc_62_0), ROS ns (vehicle1), UE num are unchanged.
#
# Prereqs on the FC (see HITL.md): flash px4_fmu-v6x_hitl, then select the
# airframe that matches this vehicle -- "RealGazebo HITL lc_62" (1003) for a
# VTOL, "HIL Quadcopter X" (1001) for a plain quad. The airframe declares the
# HIL channel layout the bridge assumes. Selecting it RESETS parameters, so
# configure the MAV_x ethernet instance AFTER, not before.

px4_target:
# 0 must still be a RealGazebo-PX4 build (used by any SITL vehicles below).
  0 : /home/user/realgazebo/RealGazebo-PX4

vehicles:
# A HITL vehicle. To mix with SITL vehicles, add normal entries alongside.
# Actuator counts are NOT set here: the model's RealGazebo plugin block
# declares them (<motorJoint> then <moveableLink>) and the manager scans it.
  0 :
    type : lc_62
    mode : hitl
    spawnpoint : (0.0, 0.0, 0.2, 0.0)
    fc :
      # --- serial FC link: ---
      # device : /dev/ttyACM0
      # baud : 921600
      # --- Ethernet FC, canonical split (see HITL.md): the FC keeps
      # its default ethernet instance on 14550 for QGC, and a DEDICATED
      # MAVLink instance on 14560 carries HIL to/from the bridge. ---
      udp : 10.41.10.2:14560
      # OPTIONAL. Port the bridge binds for this FC link; defaults to
      # 14600 + the vehicle key, which never collides across a fleet.
      # Never set it to 14550: the sim container runs with --network host,
      # so the bridge would occupy the QGC port and swallow its own relay
      # output - a self-feeding packet storm (see HITL.md).
      # local_port : 14600
    # OPTIONAL. MAVLink system id the bridge transmits as; must match the
    # FC's MAV_SYS_ID. Defaults to the vehicle key + 1 (PX4 convention).
    # sys_id : 1
