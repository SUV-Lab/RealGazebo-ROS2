# example.yaml
#
# The 10-vehicle fleet of sitl.yaml with the execution mode split across
# all three backends — same types, same spawnpoints, only `mode` (and
# what each mode needs) differs:
#
#   sitl (4)  keys 2,3,6,7 — PX4 subprocess on the sim host (build_target)
#   hitl (3)  keys 0,1,5   — a real FC per vehicle (fc: udp), one of each
#                            bench airframe: x500=1001, lc_62=1003,
#                            rover_ackermann=1004 (see docs/HITL.md)
#   pils (3)  keys 4,8,9   — PX4 on a remote PC (see docs/PILS.md);
#                            started there with run_pils_vehicle.sh
#
# Everything id-derived is unchanged in every mode: sysid = key+1, ROS
# namespace /vehicle{key+1}, gz name {type}_{key}, UE num.
# HITL fc addresses follow the fleet convention FC = 10.41.10.{N}1
# (N = key+1); each FC's MAV_SYS_ID must equal key+1.
#
# Start (GZ_IP is required whenever remote hosts participate):
#   GZ_IP=10.41.10.1 scripts/run_realgazebo.sh example.yaml

px4_target:
  0 : /home/user/realgazebo/RealGazebo-PX4

vehicles:

  0 :
    type : x500
    mode : hitl
    spawnpoint : (18.846, 14.751, -1.3, -3.14)
    fc :
      udp : 10.41.10.11:14560

  1 :
    type : lc_62
    mode : hitl
    spawnpoint : (18.846, -19.053, -0.8, -3.14)
    fc :
      udp : 10.41.10.21:14560

  2 :
    type : x500_lidar_2d
    build_target : 0
    spawnpoint : (18.846, -36.317, -0.3, -3.14)

  3 :
    type : x500
    build_target : 0
    spawnpoint : (-24.458, -12.013, 0.3, -3.14)

  4 :
    type : x500_lidar_2d
    mode : pils
    spawnpoint : (-24.458, 16.23, 0.5, -3.14)

  5 :
    type : rover_ackermann
    mode : hitl
    spawnpoint : (25.8707, 14.751, -1, -3.14)
    fc :
      udp : 10.41.10.61:14560

  6 :
    type : rover_ackermann
    build_target : 0
    spawnpoint : (25.8707, -36.317, -0.3, -3.14)

  7 :
    type : rover_ackermann
    build_target : 0
    spawnpoint : (25.8707, -10.5, -0.5, -3.14)

  8 :
    type : boat
    mode : pils
    spawnpoint : (-281.27, -235.26, 8.5, -1.57)

  9 :
    type : boat
    mode : pils
    spawnpoint : (-265.74, -235.26, 8.5, -1.57)
