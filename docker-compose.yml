# RealGazebo Multi-Container Simulation
#
# One service: the gazebo container runs the Gazebo server AND the
# realgazebo manager. Vehicles are created at runtime as sibling
# containers (one per vehicle), driven by UDP spawn commands and/or a
# boot YAML — the manager replaced the retired generate_compose flow.
#
# Image: pulled from Docker Hub (aware4docker/realgazebo:1.3-rc1). To run local
# changes instead, bake the working tree over it (see docker/Dockerfile.dev):
#   docker build -f docker/Dockerfile.dev -t aware4docker/realgazebo:1.3-rc1 .
#
# Usage (or use scripts/start_compose_simulation.sh / stop_compose_simulation.sh):
#   docker compose up -d
#   MANAGER_YAML=<container path to yaml> docker compose up -d    # boot vehicles from YAML
#   docker compose down
# Runtime spawn/despawn = UDP packets on :5006; wire contract in
# src/realgazebo/realgazebo/protocol.py (the UE plugin is the real sender).
#
# Development (mounts the working tree and builds at startup instead of
# using the baked image):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

networks:
  # Fixed names (no compose project prefix) so the manager can attach
  # runtime vehicle containers by the same names it was configured with.
  gazebo-network:
    name: gazebo-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  vehicle-network:
    name: vehicle-network
    driver: bridge
    internal: true  # no external access; isolated per-vehicle DDS
    ipam:
      config:
        - subnet: 172.30.0.0/16

services:
  # Gazebo server + realgazebo manager
  gazebo:
    image: ${MANAGER_IMAGE:-aware4docker/realgazebo:1.3-rc1}
    container_name: gazebo
    hostname: gazebo
    privileged: true
    runtime: nvidia
    # tini as PID 1: a bare `ros2 launch` as PID 1 never receives SIGTERM
    # (the kernel drops handler-less signals to init), so `compose down`
    # could not trigger the manager's vehicle teardown
    init: true
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: 1
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      GZ_IP: 172.20.0.2
      GZ_PARTITION: realgazebo
      # empty = skip the entrypoint usermod walk over the baked home dir
      # (minutes of delay); the manager + gz server run as root
      LOCAL_USER_ID: ""
      MANAGER_YAML: ${MANAGER_YAML:-}
    ports:
      - "5006:5006/udp"   # UE / host -> manager spawn & despawn commands
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
      - /var/run/docker.sock:/var/run/docker.sock   # sibling-container control
      - ./config:/config:ro   # host-provided vehicle yamls (MANAGER_YAML=/config/...)
    networks:
      gazebo-network:
        ipv4_address: 172.20.0.2
      # Also on vehicle-network: compose only creates networks referenced
      # by started services, and vehicles are not compose services.
      # Vehicles sit at .10+, so .2 is free.
      vehicle-network:
        ipv4_address: 172.30.0.2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # give the manager time to despawn every vehicle on `compose down`
    stop_grace_period: 30s
    healthcheck:
      # Must follow WORLD: the clock topic is namespaced by the gz world name,
      # so a hardcoded world here reports "healthy" for a server that is
      # actually running something else - or never goes healthy at all.
      test: ["CMD-SHELL", "su -s /bin/bash user -c 'source /opt/ros/jazzy/setup.bash && timeout 5 gz topic -e -t /world/${WORLD:-c-track}/clock -n 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      source /home/user/realgazebo/RealGazebo-ROS2/install/setup.bash &&
      exec ros2 launch realgazebo manager_sim.launch.py
      sigterm_timeout:=20 sigkill_timeout:=10
      $${MANAGER_YAML:+yaml_path:=$$MANAGER_YAML}
      headless:=${HEADLESS:-true} world:=${WORLD:-c-track}
      terrain:=${TERRAIN:-c-track}
      px4_path:=/home/user/realgazebo/RealGazebo-PX4
      unreal_ip:=${UNREAL_IP:-host.docker.internal}
      unreal_port:=${UNREAL_PORT:-5005}
      backend:=docker
      mavlink_gcs_ip:=${MAVLINK_GCS_IP:-172.17.0.1}
      docker_image:=${VEHICLE_IMAGE:-aware4docker/realgazebo:1.3-rc1}"
    deploy:
      resources:
        limits:
          memory: 64G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
